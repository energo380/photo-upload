<!-- ============================================================
     INDEX.HTML - ЦЕЛИКОМ
     Версия: 2.4 (добавлен буфер отправки заявок + индикатор)
     Серверная часть, стили формы и вёрстка не изменены.
     Добавлены: новый CSS-блок индикатора очереди,
     логика localStorage-очереди, обёртка saveOrder.
     ============================================================ -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявки на материалы</title>
    <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    color: #ffffff;
}

.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.login-box {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.login-box h1 {
    text-align: center;
    margin-bottom: 10px;
    font-size: 24px;
    background: linear-gradient(90deg, #00d4ff, #00ff88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.login-box h2 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 14px;
    color: #aaa;
    font-weight: normal;
}

.login-box input {
    width: 100%;
    padding: 15px;
    margin-bottom: 20px;
    border: none;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 16px;
    transition: all 0.3s ease;
}

.login-box input:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
}

.login-box input::placeholder { color: #888; }

.login-box button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #00d4ff, #00ff88);
    color: #1a1a2e;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
}

.login-box button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
}

.error-message {
    color: #ff6b6b;
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
}

.main-container {
    display: none;
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    flex-wrap: wrap;
    gap: 15px;
}

.header h1 {
    font-size: 24px;
    background: linear-gradient(90deg, #00d4ff, #00ff88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.user-info {
    display: flex;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.user-info span { color: #aaa; font-size: 14px; }

.user-info .department {
    background: rgba(0, 212, 255, 0.2);
    padding: 5px 15px;
    border-radius: 20px;
    color: #00d4ff;
    font-weight: bold;
}

.header-buttons { display: flex; gap: 10px; flex-wrap: wrap; }

.btn {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.btn-primary {
    background: linear-gradient(90deg, #00d4ff, #00ff88);
    color: #1a1a2e;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }

.btn-danger {
    background: rgba(255, 107, 107, 0.2);
    color: #ff6b6b;
    border: 1px solid rgba(255, 107, 107, 0.3);
}

.btn-danger:hover { background: rgba(255, 107, 107, 0.3); }

.order-form {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.form-header {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.form-group { display: flex; flex-direction: column; gap: 8px; }

.form-group label {
    color: #aaa;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.form-group input,
.form-group select {
    padding: 12px 15px;
    border: none;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 14px;
    transition: all 0.3s ease;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
}

.form-group select option { background: #1a1a2e; color: #fff; }

.form-group input:disabled,
.form-group select:disabled { opacity: 0.6; cursor: not-allowed; }

.positions-section h3 { margin-bottom: 15px; color: #00d4ff; font-size: 16px; }

.positions-table-container {
    overflow-x: auto;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.positions-table { width: 100%; border-collapse: collapse; min-width: 800px; }

.positions-table th {
    background: rgba(0, 212, 255, 0.1);
    padding: 12px 10px;
    text-align: left;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #00d4ff;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.positions-table td {
    padding: 8px 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.positions-table tr:hover { background: rgba(255, 255, 255, 0.02); }

.positions-table input,
.positions-table select {
    width: 100%;
    padding: 8px 10px;
    border: none;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 13px;
}

.positions-table input:focus,
.positions-table select:focus { outline: none; background: rgba(255, 255, 255, 0.15); }

.positions-table select option { background: #1a1a2e; color: #fff; }

.positions-table .col-num { width: 50px; text-align: center; }
.positions-table .col-name { min-width: 200px; }
.positions-table .col-unit { width: 100px; }
.positions-table .col-qty { width: 80px; }
.positions-table .col-article { width: 120px; }
.positions-table .col-note { min-width: 150px; }
.positions-table .col-status { width: 70px; text-align: center; }
.positions-table .col-action { width: 50px; text-align: center; }

.status-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}

.status-btn.not-completed {
    background: rgba(255, 107, 107, 0.3);
    color: #ff6b6b;
    box-shadow: 0 0 10px rgba(255, 107, 107, 0.3);
}

.status-btn.completed {
    background: rgba(0, 255, 136, 0.3);
    color: #00ff88;
    box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
}

.status-btn:hover { transform: scale(1.1); }
.status-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.delete-row-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 107, 107, 0.2);
    color: #ff6b6b;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 18px;
}

.delete-row-btn:hover { background: rgba(255, 107, 107, 0.4); transform: scale(1.1); }

.form-actions { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; }

.add-row-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: rgba(0, 212, 255, 0.1);
    border: 1px dashed rgba(0, 212, 255, 0.3);
    border-radius: 10px;
    color: #00d4ff;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 14px;
}

.add-row-btn:hover { background: rgba(0, 212, 255, 0.2); border-style: solid; }

.modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-overlay.active { display: flex; }

.modal {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border-radius: 20px;
    width: 100%;
    max-width: 1200px;
    max-height: 90vh;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 30px;
    background: rgba(0, 212, 255, 0.1);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.modal-header h2 { color: #00d4ff; font-size: 18px; }

.modal-close {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    cursor: pointer;
    font-size: 20px;
    transition: all 0.3s ease;
}

.modal-close:hover { background: rgba(255, 107, 107, 0.3); color: #ff6b6b; }

.modal-body { padding: 30px; overflow-y: auto; max-height: calc(90vh - 140px); }

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 20px 30px;
    background: rgba(0, 0, 0, 0.2);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.history-filters { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
.history-filters .form-group { min-width: 150px; }

.history-table { width: 100%; border-collapse: collapse; }

.history-table th {
    background: rgba(0, 212, 255, 0.1);
    padding: 12px 15px;
    text-align: left;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #00d4ff;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.history-table td {
    padding: 12px 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    font-size: 14px;
}

.history-table tr:hover { background: rgba(255, 255, 255, 0.05); }
.history-table tr { cursor: pointer; transition: all 0.2s ease; }

.status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.status-badge.completed { background: rgba(0, 255, 136, 0.2); color: #00ff88; }
.status-badge.partial { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
.status-badge.pending { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }

.order-details-header {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
    padding: 20px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
}

.detail-item { display: flex; flex-direction: column; gap: 5px; }
.detail-item label { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
.detail-item span { color: #fff; font-size: 14px; font-weight: 500; }

.loading-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 2000;
    justify-content: center;
    align-items: center;
}

.loading-overlay.active { display: flex; }

.spinner {
    width: 50px; height: 50px;
    border: 4px solid rgba(255, 255, 255, 0.1);
    border-top-color: #00d4ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.toast {
    position: fixed;
    bottom: 30px; right: 30px;
    padding: 15px 25px;
    border-radius: 10px;
    color: white;
    font-weight: 500;
    z-index: 3000;
    transform: translateX(150%);
    transition: transform 0.3s ease;
    max-width: 350px;
}

.toast.active { transform: translateX(0); }
.toast.success { background: linear-gradient(135deg, #00ff88, #00d4ff); color: #1a1a2e; }
.toast.error { background: linear-gradient(135deg, #ff6b6b, #ff8e8e); color: #1a1a2e; }
.toast.warning { background: linear-gradient(135deg, #ffc107, #ffdb4d); color: #1a1a2e; }

@media (max-width: 768px) {
    .header { flex-direction: column; align-items: flex-start; }
    .header-buttons { width: 100%; }
    .header-buttons .btn { flex: 1; justify-content: center; }
    .form-header { grid-template-columns: 1fr; }
    .modal { margin: 10px; max-height: 95vh; }
    .modal-body { padding: 15px; }
    .history-filters { flex-direction: column; }
    .history-filters .form-group { width: 100%; }
}

@media print {
    body { background: white !important; color: black !important; }
    .login-container, .header, .form-actions, .modal-overlay, .btn,
    .delete-row-btn, .add-row-btn, .loading-overlay, .toast { display: none !important; }
    .main-container { display: block !important; padding: 0; max-width: none; }
    .order-form { background: white; border: none; padding: 0; }
    #queueWidget, #queuePanel { display: none !important; }
}

/* ===== НОВЫЕ СТИЛИ: плавающий индикатор очереди отправки ===== */
#queueWidget {
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 3500;
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: #e6f7ff;
    background: rgba(26, 26, 46, 0.92);
    border: 1px solid rgba(0, 212, 255, 0.35);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(6px);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    user-select: none;
}
#queueWidget:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,0.5); }

#queueWidget .qw-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    background: #00d4ff;
}
#queueWidget.state-sending .qw-dot { background: #ffc107; animation: qwPulse 1s ease-in-out infinite; }
#queueWidget.state-error   .qw-dot { background: #ff6b6b; }
#queueWidget.state-pending .qw-dot { background: #00d4ff; }
#queueWidget.state-ok      .qw-dot { background: #00ff88; }

@keyframes qwPulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

#queueWidget .qw-count {
    min-width: 20px;
    text-align: center;
    padding: 2px 8px;
    border-radius: 12px;
    background: rgba(0, 212, 255, 0.18);
    color: #00d4ff;
}

#queuePanel {
    position: fixed;
    left: 20px;
    bottom: 70px;
    z-index: 3600;
    display: none;
    width: 360px;
    max-width: calc(100vw - 40px);
    max-height: 60vh;
    overflow-y: auto;
    padding: 14px;
    border-radius: 16px;
    color: #fff;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border: 1px solid rgba(0, 212, 255, 0.3);
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
}
#queuePanel.active { display: block; }

#queuePanel .qp-title {
    color: #00d4ff;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
#queuePanel .qp-title .qp-close {
    cursor: pointer;
    color: #aaa;
    font-size: 16px;
    padding: 0 4px;
}
#queuePanel .qp-title .qp-close:hover { color: #ff6b6b; }

#queuePanel .qp-empty { color: #888; font-size: 13px; text-align: center; padding: 16px 0; }

.qp-item {
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
    background: rgba(255,255,255,0.03);
}
.qp-item .qp-row1 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
}
.qp-item .qp-status {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.qp-item .qp-status.pending { background: rgba(0,212,255,0.18); color: #00d4ff; }
.qp-item .qp-status.sending { background: rgba(255,193,7,0.18); color: #ffc107; }
.qp-item .qp-status.error   { background: rgba(255,107,107,0.18); color: #ff6b6b; }
.qp-item .qp-status.sent    { background: rgba(0,255,136,0.18); color: #00ff88; }

.qp-item .qp-meta { font-size: 12px; color: #bbb; margin-bottom: 4px; }
.qp-item .qp-err {
    font-size: 11px;
    color: #ff9b9b;
    margin-bottom: 8px;
    word-break: break-word;
}
.qp-item .qp-actions { display: flex; gap: 8px; }
.qp-item .qp-btn {
    flex: 1;
    padding: 7px 10px;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
}
.qp-item .qp-btn.retry {
    background: rgba(0,212,255,0.18);
    color: #00d4ff;
    border: 1px solid rgba(0,212,255,0.3);
}
.qp-item .qp-btn.retry:hover { background: rgba(0,212,255,0.32); }
.qp-item .qp-btn.retry:disabled { opacity: 0.4; cursor: not-allowed; }
.qp-item .qp-btn.del {
    background: rgba(255,107,107,0.18);
    color: #ff6b6b;
    border: 1px solid rgba(255,107,107,0.3);
}
.qp-item .qp-btn.del:hover { background: rgba(255,107,107,0.32); }
/* ===== КОНЕЦ НОВЫХ СТИЛЕЙ ===== */
    </style>
</head>
<body>

    <!-- ЭКРАН ЛОГИНА -->
    <div class="login-container" id="loginScreen">
        <div class="login-box">
            <h1>Заявки на материалы</h1>
            <h2>Вход в систему</h2>
            <input type="text" id="loginInput" placeholder="Логин" autocomplete="username">
            <input type="password" id="passwordInput" placeholder="Пароль" autocomplete="current-password">
            <button onclick="doLogin()">Войти</button>
            <div class="error-message" id="loginError"></div>
        </div>
    </div>

    <!-- ОСНОВНОЙ ЭКРАН -->
    <div class="main-container" id="mainScreen">
        <div class="header">
            <h1>Заявки на материалы</h1>
            <div class="user-info">
                <span id="userName"></span>
                <span class="department" id="userDepartment"></span>
                <div class="header-buttons">
                    <button class="btn btn-secondary" onclick="openHistory()">История</button>
                    <button class="btn btn-danger" onclick="doLogout()">Выход</button>
                </div>
            </div>
        </div>

        <div class="order-form">
            <div class="form-header">
                <div class="form-group">
                    <label>Номер заявки</label>
                    <input type="text" id="orderNumber" readonly>
                </div>
                <div class="form-group">
                    <label>Дата</label>
                    <input type="text" id="orderDate" readonly>
                </div>
                <div class="form-group">
                    <label>Подразделение</label>
                    <input type="text" id="orderDepartment" readonly>
                </div>
                <div class="form-group">
                    <label>Заявитель</label>
                    <input type="text" id="orderApplicant" readonly>
                </div>
            </div>

            <div class="positions-section">
                <h3>Позиции заявки</h3>
                <div class="positions-table-container">
                    <table class="positions-table">
                        <thead>
                            <tr>
                                <th class="col-num">№</th>
                                <th class="col-name">Наименование</th>
                                <th class="col-unit">Ед. изм.</th>
                                <th class="col-qty">Кол-во</th>
                                <th class="col-article">Артикул</th>
                                <th class="col-note">Примечание</th>
                                <th class="col-action"></th>
                            </tr>
                        </thead>
                        <tbody id="positionsBody"></tbody>
                    </table>
                </div>
                <button class="add-row-btn" onclick="addPositionRow()">+ Добавить позицию</button>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" onclick="saveOrder()">Отправить</button>
                <button class="btn btn-secondary" onclick="clearForm()">Очистить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ИСТОРИИ -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal">
            <div class="modal-header">
                <h2>История заявок</h2>
                <button class="modal-close" onclick="closeModal('historyModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="history-filters">
                    <div class="form-group">
                        <label>Дата с</label>
                        <input type="date" id="filterDateFrom">
                    </div>
                    <div class="form-group">
                        <label>Дата по</label>
                        <input type="date" id="filterDateTo">
                    </div>
                    <div class="form-group" id="filterDeptGroup" style="display:none;">
                        <label>Подразделение</label>
                        <select id="filterDepartment"><option value="">Все</option></select>
                    </div>
                    <div class="form-group">
                        <label>&nbsp;</label>
                        <button class="btn btn-primary" onclick="loadHistory()">Применить</button>
                    </div>
                </div>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Номер</th>
                            <th>Дата</th>
                            <th>Подразделение</th>
                            <th>Заявитель</th>
                            <th>Позиций</th>
                            <th>Статус</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ДЕТАЛЕЙ ЗАЯВКИ -->
    <div class="modal-overlay" id="detailsModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Детали заявки</h2>
                <button class="modal-close" onclick="closeModal('detailsModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="order-details-header" id="detailsHeader"></div>
                <div class="positions-table-container">
                    <table class="positions-table">
                        <thead>
                            <tr>
                                <th class="col-num">№</th>
                                <th class="col-name">Наименование</th>
                                <th class="col-unit">Ед. изм.</th>
                                <th class="col-qty">Кол-во</th>
                                <th class="col-article">Артикул</th>
                                <th class="col-note">Примечание</th>
                                <th class="col-status">Статус</th>
                            </tr>
                        </thead>
                        <tbody id="detailsBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="printOrder()">Печать</button>
                <button class="btn btn-primary" id="saveStatusBtn" onclick="saveStatuses()" style="display:none;">Сохранить статусы</button>
            </div>
        </div>
    </div>

    <!-- ПЛАВАЮЩИЙ ИНДИКАТОР ОЧЕРЕДИ (НОВОЕ) -->
    <div id="queueWidget" onclick="toggleQueuePanel()">
        <span class="qw-dot"></span>
        <span class="qw-label">Очередь</span>
        <span class="qw-count">0</span>
    </div>

    <!-- ПАНЕЛЬ ОЧЕРЕДИ (НОВОЕ) -->
    <div id="queuePanel">
        <div class="qp-title">
            <span>Очередь отправки</span>
            <span class="qp-close" onclick="toggleQueuePanel()">&times;</span>
        </div>
        <div id="queuePanelBody"></div>
    </div>

    <!-- ЗАГРУЗКА -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

<script>
/* ================= КОНФИГУРАЦИЯ ================= */
const API_URL = 'ВСТАВЬТЕ_СЮДА_URL_ВАШЕГО_APPS_SCRIPT';
const REQUEST_TIMEOUT = 20000;

let currentUser = null;
let positionCounter = 0;
let currentOrderData = null;

/* ================= JSONP (НЕ МЕНЯТЬ) ================= */
function apiRequest(params) {
    return new Promise((resolve) => {
        const callbackName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        let done = false;

        const timeoutId = setTimeout(() => {
            if (done) return;
            done = true;
            cleanup();
            resolve({ success: false, timeout: true, error: 'Превышено время ожидания ответа сервера' });
        }, REQUEST_TIMEOUT);

        function cleanup() {
            clearTimeout(timeoutId);
            try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
            if (script && script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = function (response) {
            if (done) return;
            done = true;
            cleanup();
            resolve(response);
        };

        const query = Object.keys(params)
            .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(
                typeof params[k] === 'object' ? JSON.stringify(params[k]) : params[k]
            )).join('&');

        const script = document.createElement('script');
        script.src = API_URL + '?callback=' + callbackName + '&' + query;
        script.onerror = function () {
            if (done) return;
            done = true;
            cleanup();
            resolve({ success: false, error: 'Ошибка сети при обращении к серверу' });
        };
        document.body.appendChild(script);
    });
}

/* ================= UI HELPERS ================= */
function showLoading() { document.getElementById('loadingOverlay').classList.add('active'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.remove('active'); }

function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast ' + type + ' active';
    setTimeout(() => { toast.className = 'toast ' + type; }, 3500);
}

function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

/* ================= ЛОГИН / РОЛИ ================= */
async function doLogin() {
    const login = document.getElementById('loginInput').value.trim();
    const password = document.getElementById('passwordInput').value.trim();
    const errBox = document.getElementById('loginError');
    errBox.textContent = '';

    if (!login || !password) { errBox.textContent = 'Введите логин и пароль'; return; }

    showLoading();
    const res = await apiRequest({ action: 'login', login: login, password: password });
    hideLoading();

    if (res && res.success) {
        currentUser = res.user;
        onLoginSuccess();
    } else {
        errBox.textContent = (res && res.error) ? res.error : 'Неверный логин или пароль';
    }
}

function onLoginSuccess() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'block';
    document.getElementById('userName').textContent = currentUser.name || currentUser.login;
    document.getElementById('userDepartment').textContent = currentUser.department || '';
    if (currentUser.role === 'admin') {
        document.getElementById('filterDeptGroup').style.display = 'flex';
    }
    initNewOrder();
    updateQueueUI();
}

function doLogout() {
    currentUser = null;
    document.getElementById('mainScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('loginInput').value = '';
    document.getElementById('passwordInput').value = '';
    document.getElementById('loginError').textContent = '';
}

/* ================= НОВАЯ ЗАЯВКА / ФОРМА ================= */
function initNewOrder() {
    const now = new Date();
    document.getElementById('orderNumber').value = 'AUTO';
    document.getElementById('orderDate').value = now.toLocaleDateString('ru-RU');
    document.getElementById('orderDepartment').value = currentUser.department || '';
    document.getElementById('orderApplicant').value = currentUser.name || currentUser.login;
    document.getElementById('positionsBody').innerHTML = '';
    positionCounter = 0;
    addPositionRow();
    addPositionRow();
    addPositionRow();
}

function addPositionRow() {
    positionCounter++;
    const tbody = document.getElementById('positionsBody');
    const tr = document.createElement('tr');
    tr.innerHTML =
        '<td class="col-num row-num"></td>' +
        '<td class="col-name"><input type="text" class="pos-name" placeholder="Наименование"></td>' +
        '<td class="col-unit">' +
            '<select class="pos-unit">' +
                '<option value="шт">шт</option>' +
                '<option value="м">м</option>' +
                '<option value="м2">м2</option>' +
                '<option value="м3">м3</option>' +
                '<option value="кг">кг</option>' +
                '<option value="л">л</option>' +
                '<option value="упак">упак</option>' +
                '<option value="компл">компл</option>' +
            '</select>' +
        '</td>' +
        '<td class="col-qty"><input type="number" class="pos-qty" min="0" step="any" placeholder="0"></td>' +
        '<td class="col-article"><input type="text" class="pos-article" placeholder="Артикул"></td>' +
        '<td class="col-note"><input type="text" class="pos-note" placeholder="Примечание"></td>' +
        '<td class="col-action"><button class="delete-row-btn" onclick="deletePositionRow(this)">&times;</button></td>';
    tbody.appendChild(tr);
    renumberRows();
}

function deletePositionRow(btn) {
    const tr = btn.closest('tr');
    tr.parentNode.removeChild(tr);
    renumberRows();
}

function renumberRows() {
    const rows = document.querySelectorAll('#positionsBody tr');
    rows.forEach((r, i) => { r.querySelector('.row-num').textContent = (i + 1); });
}

function collectPositions() {
    const rows = document.querySelectorAll('#positionsBody tr');
    const positions = [];
    rows.forEach(r => {
        const name = r.querySelector('.pos-name').value.trim();
        const unit = r.querySelector('.pos-unit').value;
        const qty = r.querySelector('.pos-qty').value.trim();
        const article = r.querySelector('.pos-article').value.trim();
        const note = r.querySelector('.pos-note').value.trim();
        if (name) {
            positions.push({ name, unit, qty, article, note, status: 'pending' });
        }
    });
    return positions;
}

/* clearForm вызывается при старте следующей новой заявки.
   Именно здесь чистим успешно отправленные (sent) записи буфера. */
function clearForm() {
    purgeSentFromQueue();
    initNewOrder();
    updateQueueUI();
}
     /* ================= БУФЕР ОЧЕРЕДИ (НОВОЕ) ================= */
const QUEUE_KEY = 'mat_order_queue';

function loadQueue() {
    try {
        const raw = localStorage.getItem(QUEUE_KEY);
        if (!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
    } catch (e) {
        return [];
    }
}

function saveQueue(queue) {
    try {
        localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
    } catch (e) {
        showToast('Не удалось сохранить очередь (localStorage)', 'error');
    }
}

function genQueueId() {
    return 'q_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
}

/* Добавить новую заявку в очередь. Возвращает id записи. */
function enqueueOrder(body) {
    const queue = loadQueue();
    const item = {
        id: genQueueId(),
        createdAt: new Date().toISOString(),
        body: body,
        status: 'pending',
        attempts: 0,
        lastError: ''
    };
    queue.push(item);
    saveQueue(queue);
    return item.id;
}

function updateQueueItem(id, patch) {
    const queue = loadQueue();
    const idx = queue.findIndex(x => x.id === id);
    if (idx === -1) return;
    queue[idx] = Object.assign({}, queue[idx], patch);
    saveQueue(queue);
}

function removeQueueItem(id) {
    const queue = loadQueue().filter(x => x.id !== id);
    saveQueue(queue);
    updateQueueUI();
}

/* Чистка успешно отправленных (sent) записей.
   Вызывается при старте формирования следующей заявки. */
function purgeSentFromQueue() {
    const queue = loadQueue().filter(x => x.status !== 'sent');
    saveQueue(queue);
}

/* Определение агрегированного состояния для индикатора. */
function getQueueState(queue) {
    if (queue.some(x => x.status === 'sending')) return 'sending';
    if (queue.some(x => x.status === 'error'))   return 'error';
    if (queue.some(x => x.status === 'pending')) return 'pending';
    if (queue.length > 0 && queue.every(x => x.status === 'sent')) return 'ok';
    return 'pending';
}

function stateLabel(state) {
    switch (state) {
        case 'sending': return 'Отправка…';
        case 'error':   return 'Ошибка';
        case 'pending': return 'Ожидает';
        case 'ok':      return 'Отправлено';
        default:        return 'Очередь';
    }
}

/* Обновление индикатора и панели. */
function updateQueueUI() {
    const widget = document.getElementById('queueWidget');
    const countEl = widget.querySelector('.qw-count');
    const labelEl = widget.querySelector('.qw-label');
    const queue = loadQueue();

    if (!currentUser || queue.length === 0) {
        widget.style.display = 'none';
        const panel = document.getElementById('queuePanel');
        if (panel) panel.classList.remove('active');
    } else {
        widget.style.display = 'flex';
        const state = getQueueState(queue);
        widget.className = 'state-' + state;
        widget.id = 'queueWidget';
        labelEl.textContent = stateLabel(state);
        countEl.textContent = queue.length;
    }

    renderQueuePanel();
}

function toggleQueuePanel() {
    const panel = document.getElementById('queuePanel');
    if (panel.classList.contains('active')) {
        panel.classList.remove('active');
    } else {
        renderQueuePanel();
        panel.classList.add('active');
    }
}

function escapeHtml(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function statusText(st) {
    switch (st) {
        case 'pending': return 'Ожидает';
        case 'sending': return 'Отправка';
        case 'error':   return 'Ошибка';
        case 'sent':    return 'Отправлено';
        default:        return st;
    }
}

function renderQueuePanel() {
    const body = document.getElementById('queuePanelBody');
    const queue = loadQueue();

    if (queue.length === 0) {
        body.innerHTML = '<div class="qp-empty">Очередь пуста</div>';
        return;
    }

    let html = '';
    queue.forEach(item => {
        const created = new Date(item.createdAt).toLocaleString('ru-RU');
        const posCount = (item.body && item.body.positions) ? item.body.positions.length : 0;
        const canRetry = (item.status === 'error');
        html +=
            '<div class="qp-item">' +
                '<div class="qp-row1">' +
                    '<span class="qp-meta">Позиций: ' + posCount + '</span>' +
                    '<span class="qp-status ' + item.status + '">' + statusText(item.status) + '</span>' +
                '</div>' +
                '<div class="qp-meta">Создана: ' + escapeHtml(created) + '</div>' +
                '<div class="qp-meta">Попыток: ' + (item.attempts || 0) + '</div>' +
                (item.lastError ? '<div class="qp-err">' + escapeHtml(item.lastError) + '</div>' : '') +
                '<div class="qp-actions">' +
                    '<button class="qp-btn retry" ' + (canRetry ? '' : 'disabled') +
                        ' onclick="retryQueueItem(\'' + item.id + '\')">Повторить</button>' +
                    '<button class="qp-btn del" onclick="deleteQueueItem(\'' + item.id + '\')">Удалить</button>' +
                '</div>' +
            '</div>';
    });
    body.innerHTML = html;
}

function deleteQueueItem(id) {
    removeQueueItem(id);
}

/* Повторная отправка — ТОЛЬКО вручную. */
async function retryQueueItem(id) {
    const queue = loadQueue();
    const item = queue.find(x => x.id === id);
    if (!item) return;
    if (item.status === 'sending') return;

    updateQueueItem(id, { status: 'sending', lastError: '' });
    updateQueueUI();
    showLoading();

    const res = await apiRequest(Object.assign({ action: 'saveOrder' }, item.body));

    hideLoading();

    if (res && res.success === true) {
        updateQueueItem(id, {
            status: 'sent',
            attempts: (item.attempts || 0) + 1,
            lastError: ''
        });
        showToast('Заявка успешно отправлена', 'success');
    } else {
        const errText = res && res.timeout
            ? 'Таймаут: ответ сервера не получен'
            : (res && res.error ? res.error : 'Неизвестная ошибка отправки');
        updateQueueItem(id, {
            status: 'error',
            attempts: (item.attempts || 0) + 1,
            lastError: errText
        });
        showToast('Ошибка отправки: ' + errText, 'error');
    }
    updateQueueUI();
}
     /* ================= ОБЁРНУТАЯ ОТПРАВКА НОВОЙ ЗАЯВКИ ================= */
/* Именно saveOrder оборачивает буфер.
   1) собираем тело; 2) кладём в очередь (pending);
   3) статус sending; 4) при success -> sent (НЕ удаляем);
   5) при ошибке/таймауте -> error (остаётся в очереди). */
async function saveOrder() {
    const positions = collectPositions();

    if (positions.length === 0) {
        showToast('Добавьте хотя бы одну позицию', 'warning');
        return;
    }

    const body = {
        login: currentUser.login,
        department: document.getElementById('orderDepartment').value,
        applicant: document.getElementById('orderApplicant').value,
        date: document.getElementById('orderDate').value,
        positions: positions
    };

    // 1) кладём в очередь
    const queueId = enqueueOrder(body);
    updateQueueUI();

    // 2) статус sending
    updateQueueItem(queueId, { status: 'sending', lastError: '' });
    updateQueueUI();

    showLoading();
    const res = await apiRequest(Object.assign({ action: 'saveOrder' }, body));
    hideLoading();

    const item = loadQueue().find(x => x.id === queueId) || { attempts: 0 };

    if (res && res.success === true) {
        // УСПЕХ: НЕ удаляем сразу, ставим sent.
        // Удаление произойдёт при старте следующей новой заявки (clearForm).
        updateQueueItem(queueId, {
            status: 'sent',
            attempts: (item.attempts || 0) + 1,
            lastError: ''
        });
        updateQueueUI();

        const num = res.orderNumber || res.number || '';
        showToast('Заявка' + (num ? ' №' + num : '') + ' сохранена', 'success');

        // старт следующей новой заявки: чистим sent и обновляем форму
        clearForm();
    } else {
        // ОШИБКА / ТАЙМАУТ / НЕТ СЕТИ: остаётся в очереди со статусом error
        const errText = res && res.timeout
            ? 'Таймаут: ответ сервера не получен'
            : (res && res.error ? res.error : 'Неизвестная ошибка отправки');
        updateQueueItem(queueId, {
            status: 'error',
            attempts: (item.attempts || 0) + 1,
            lastError: errText
        });
        updateQueueUI();
        showToast('Ошибка отправки: ' + errText + '. Заявка сохранена в очереди.', 'error');
    }
}

/* ================= ИСТОРИЯ ================= */
async function openHistory() {
    openModal('historyModal');
    if (currentUser.role === 'admin') { await loadDepartmentsFilter(); }
    await loadHistory();
}

async function loadDepartmentsFilter() {
    const res = await apiRequest({ action: 'getDepartments', login: currentUser.login });
    if (res && res.success && Array.isArray(res.departments)) {
        const sel = document.getElementById('filterDepartment');
        sel.innerHTML = '<option value="">Все</option>';
        res.departments.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d;
            sel.appendChild(opt);
        });
    }
}

async function loadHistory() {
    showLoading();
    const params = {
        action: 'getHistory',
        login: currentUser.login,
        dateFrom: document.getElementById('filterDateFrom').value,
        dateTo: document.getElementById('filterDateTo').value
    };
    if (currentUser.role === 'admin') {
        params.department = document.getElementById('filterDepartment').value;
    }
    const res = await apiRequest(params);
    hideLoading();

    const tbody = document.getElementById('historyBody');
    tbody.innerHTML = '';

    if (!res || !res.success || !Array.isArray(res.orders)) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888;">Нет данных</td></tr>';
        return;
    }

    if (res.orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888;">Заявки не найдены</td></tr>';
        return;
    }

    res.orders.forEach(o => {
        const tr = document.createElement('tr');
        tr.onclick = () => openOrderDetails(o.number);
        const statusInfo = getOrderStatusInfo(o);
        tr.innerHTML =
            '<td>' + escapeHtml(o.number) + '</td>' +
            '<td>' + escapeHtml(o.date) + '</td>' +
            '<td>' + escapeHtml(o.department) + '</td>' +
            '<td>' + escapeHtml(o.applicant) + '</td>' +
            '<td>' + (o.positionsCount != null ? o.positionsCount : (o.positions ? o.positions.length : 0)) + '</td>' +
            '<td><span class="status-badge ' + statusInfo.cls + '">' + statusInfo.text + '</span></td>';
        tbody.appendChild(tr);
    });
}

function getOrderStatusInfo(o) {
    const positions = o.positions || [];
    const total = positions.length;
    const done = positions.filter(p => p.status === 'completed').length;
    if (total > 0 && done === total) return { cls: 'completed', text: 'Выполнено' };
    if (done > 0) return { cls: 'partial', text: 'Частично' };
    return { cls: 'pending', text: 'В работе' };
}

/* ================= ДЕТАЛИ ЗАЯВКИ ================= */
async function openOrderDetails(orderNumber) {
    showLoading();
    const res = await apiRequest({ action: 'getOrder', login: currentUser.login, number: orderNumber });
    hideLoading();

    if (!res || !res.success || !res.order) {
        showToast('Не удалось загрузить заявку', 'error');
        return;
    }

    currentOrderData = res.order;
    renderOrderDetails(res.order);
    openModal('detailsModal');
}

function renderOrderDetails(order) {
    const header = document.getElementById('detailsHeader');
    header.innerHTML =
        '<div class="detail-item"><label>Номер</label><span>' + escapeHtml(order.number) + '</span></div>' +
        '<div class="detail-item"><label>Дата</label><span>' + escapeHtml(order.date) + '</span></div>' +
        '<div class="detail-item"><label>Подразделение</label><span>' + escapeHtml(order.department) + '</span></div>' +
        '<div class="detail-item"><label>Заявитель</label><span>' + escapeHtml(order.applicant) + '</span></div>';

    const tbody = document.getElementById('detailsBody');
    tbody.innerHTML = '';
    const isAdmin = (currentUser.role === 'admin');

    (order.positions || []).forEach((p, i) => {
        const tr = document.createElement('tr');
        const done = (p.status === 'completed');
        tr.innerHTML =
            '<td class="col-num">' + (i + 1) + '</td>' +
            '<td class="col-name">' + escapeHtml(p.name) + '</td>' +
            '<td class="col-unit">' + escapeHtml(p.unit) + '</td>' +
            '<td class="col-qty">' + escapeHtml(p.qty) + '</td>' +
            '<td class="col-article">' + escapeHtml(p.article) + '</td>' +
            '<td class="col-note">' + escapeHtml(p.note) + '</td>' +
            '<td class="col-status">' +
                '<button class="status-btn ' + (done ? 'completed' : 'not-completed') + '" ' +
                    (isAdmin ? '' : 'disabled') +
                    ' data-index="' + i + '" onclick="toggleStatus(this)">' +
                    (done ? '✓' : '✗') +
                '</button>' +
            '</td>';
        tbody.appendChild(tr);
    });

    document.getElementById('saveStatusBtn').style.display = isAdmin ? 'inline-flex' : 'none';
}

function toggleStatus(btn) {
    const idx = parseInt(btn.getAttribute('data-index'), 10);
    const pos = currentOrderData.positions[idx];
    pos.status = (pos.status === 'completed') ? 'pending' : 'completed';
    if (pos.status === 'completed') {
        btn.className = 'status-btn completed';
        btn.textContent = '✓';
    } else {
        btn.className = 'status-btn not-completed';
        btn.textContent = '✗';
    }
}

async function saveStatuses() {
    if (!currentOrderData) return;
    showLoading();
    const statuses = currentOrderData.positions.map(p => p.status || 'pending');
    const res = await apiRequest({
        action: 'updateStatuses',
        login: currentUser.login,
        number: currentOrderData.number,
        statuses: statuses
    });
    hideLoading();

    if (res && res.success) {
        showToast('Статусы сохранены', 'success');
    } else {
        showToast((res && res.error) ? res.error : 'Ошибка сохранения статусов', 'error');
    }
}

/* ================= ПЕЧАТЬ ================= */
function printOrder() { window.print(); }

/* ================= ИНИЦИАЛИЗАЦИЯ ================= */
document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && document.getElementById('loginScreen').style.display !== 'none' &&
        document.getElementById('mainScreen').style.display === 'none') {
        doLogin();
    }
});

window.addEventListener('load', function () {

});
