<!-- === PART 2 START: JavaScript (весь <script> содержимое) ===
     Содержит всю логику: форматирование даты в UTC+7, загрузку/рендер истории и новая функция printHistory(),
     которая формирует печатную страницу с таблицей истории и вызывает окно печати.
-->
<script>
    // === НАСТРОЙКИ ===
    var API_URL = 'https://script.google.com/macros/s/AKfycbzldfCbJkJ6AZfzy40Ezu4_nRRZPr5ryJLZZLnImIsuDkrBGFwLK-mbUZaqOPJoXiyT/exec';
    
    var currentPassword = '';
    var isAdmin = false;
    var settings = {
        departments: [],
        locations: [],
        powers: [],
        speeds: [],
        manufacturers: []
    };
    
    var MAX_LENGTH = 30;
    var INV_LENGTH = 5;

    // === Форматирование для Asia/Bangkok (UTC+7) ===
    var bangkokFormatter;
    try {
        bangkokFormatter = new Intl.DateTimeFormat('ru-RU', {
            timeZone: 'Asia/Bangkok',
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    } catch (e) {
        // В редком случае, если timeZone не поддержана, fallback на локальный форматтер
        bangkokFormatter = new Intl.DateTimeFormat('ru-RU', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    // Безопасная функция: принимает Date или строку, возвращает форматированную строку в Asia/Bangkok
    function formatToBangkok(dateInput) {
        if (!dateInput && dateInput !== 0) return '';
        var d;
        if (dateInput instanceof Date) {
            d = dateInput;
        } else {
            // Попытка корректно распарсить строку
            d = new Date(dateInput);
        }
        if (isNaN(d.getTime())) {
            // Если не удалось распарсить, возвращаем исходное значение (или пустую строку)
            return dateInput || '';
        }
        return bangkokFormatter.format(d);
    }
    
    // === ИНИЦИАЛИЗАЦИЯ ===
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
        updateDateTime();
        setInterval(updateDateTime, 60000);
    });
    
    function updateDateTime() {
        // Показываем текущую дату/время в зоне Asia/Bangkok (UTC+7)
        var now = new Date();
        document.getElementById('currentDateTime').textContent = formatToBangkok(now);
    }
    
    // === ЗАГРУЗКА ===
    function showLoading() {
        document.getElementById('loading').style.display = 'flex';
    }
    
    function hideLoading() {
        document.getElementById('loading').style.display = 'none';
    }
    
    // === УВЕДОМЛЕНИЯ ===
    function showNotification(message, type) {
        var existing = document.querySelector('.notification');
        if (existing) existing.remove();
        
        var div = document.createElement('div');
        div.className = 'notification ' + type;
        div.textContent = message;
        document.body.appendChild(div);
        
        setTimeout(function() { div.remove(); }, 4000);
    }
    
    // === ВХОД ===
    function login() {
        var password = document.getElementById('password').value.trim();
        
        if (!password) {
            showNotification('Введите пароль', 'error');
            return;
        }
        
        showLoading();
        
        var url = API_URL + '?action=getSettings&password=' + encodeURIComponent(password);
        
        fetch(url)
            .then(function(response) { return response.json(); })
            .then(function(result) {
                hideLoading();
                
                if (!result.success) {
                    showNotification(result.error || 'Неверный пароль', 'error');
                    return;
                }
                
                currentPassword = password;
                isAdmin = result.isAdmin || false;
                settings = {
                    departments: result.departments || [],
                    locations: result.locations || [],
                    powers: result.powers || [],
                    speeds: result.speeds || [],
                    manufacturers: result.manufacturers || []
                };
                
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainScreen').style.display = 'block';
                document.getElementById('logoContainer').style.display = 'flex';
                
                if (isAdmin) {
                    document.getElementById('settingsBtn').style.display = 'inline-flex';
                }
                
                initForm();
                showNotification('Добро пожаловать!', 'success');
            })
            .catch(function(error) {
                hideLoading();
                showNotification('Ошибка подключения: ' + error.message, 'error');
            });
    }
    
    // === ВЫХОД ===
    function logout() {
        currentPassword = '';
        isAdmin = false;
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('mainScreen').style.display = 'none';
        document.getElementById('logoContainer').style.display = 'none';
        document.getElementById('settingsBtn').style.display = 'none';
        document.getElementById('password').value = '';
    }
    
    // === ИНИЦИАЛИЗАЦИЯ ФОРМЫ ===
    function initForm() {
        document.getElementById('itemsTable').innerHTML = '';
        addRow();
        document.getElementById('responsible').value = '';
        document.getElementById('phone').value = '';
    }
    
    // === СОЗДАНИЕ SELECT ===
    function createSelect(options, placeholder) {
        var html = '<select><option value="">' + placeholder + '</option>';
        for (var i = 0; i < options.length; i++) {
            html += '<option value="' + options[i] + '">' + options[i] + '</option>';
        }
        html += '</select>';
        return html;
    }
    
    // === ДОБАВЛЕНИЕ СТРОКИ ===
    function addRow() {
        var tbody = document.getElementById('itemsTable');
        var rowNum = tbody.children.length + 1;
        
        var tr = document.createElement('tr');
        tr.innerHTML = 
            '<td class="col-num">' + rowNum + '</td>' +
            '<td class="col-dept">' + createSelect(settings.departments, 'Выберите...') + '</td>' +
            '<td class="col-loc">' + createSelect(settings.locations, 'Выберите...') + '</td>' +
            '<td class="col-motor"><input type="text" placeholder="Марка" maxlength="' + MAX_LENGTH + '"></td>' +
            '<td class="col-inv"><input type="text" placeholder="00000" maxlength="' + INV_LENGTH + '" oninput="this.value=this.value.toUpperCase().replace(/[^A-ZА-Я0-9]/g,\'\')"></td>' +
            '<td class="col-manuf">' + createSelect(settings.manufacturers, 'Выберите...') + '</td>' +
            '<td class="col-power">' + createSelect(settings.powers, 'кВт') + '</td>' +
            '<td class="col-speed">' + createSelect(settings.speeds, 'Об/мин') + '</td>' +
            '<td class="col-reason"><input type="text" placeholder="Причина" maxlength="' + MAX_LENGTH + '"></td>' +
            '<td class="col-del"><button class="btn-delete-row" onclick="deleteRow(this)">×</button></td>';
        tbody.appendChild(tr);
    }
    
    // === УДАЛЕНИЕ СТРОКИ ===
    function deleteRow(btn) {
        var tbody = document.getElementById('itemsTable');
        if (tbody.children.length <= 1) {
            showNotification('Должна остаться хотя бы одна строка', 'error');
            return;
        }
        btn.closest('tr').remove();
        renumberRows();
    }
    
    function renumberRows() {
        var rows = document.querySelectorAll('#itemsTable tr');
        for (var i = 0; i < rows.length; i++) {
            rows[i].cells[0].textContent = i + 1;
        }
    }
    
    // === ОЧИСТКА ФОРМЫ ===
    function clearForm() {
        if (confirm('Очистить все поля формы?')) {
            initForm();
            showNotification('Форма очищена', 'success');
        }
    }
    
    // === ОТПРАВКА ЗАЯВКИ (через GET для обхода CORS) ===
    function submitForm() {
        var responsible = document.getElementById('responsible').value.trim();
        var phone = document.getElementById('phone').value.trim();
        
        if (!responsible) {
            showNotification('Укажите ФИО ответственного', 'error');
            return;
        }
        
        if (!phone) {
            showNotification('Укажите контактный телефон', 'error');
            return;
        }
        
        var rows = document.querySelectorAll('#itemsTable tr');
        var items = [];
        
        for (var i = 0; i < rows.length; i++) {
            var cells = rows[i].cells;
            var motor = cells[3].querySelector('input').value.trim();
            
            if (!motor) continue;
            
            var department = cells[1].querySelector('select').value;
            var location = cells[2].querySelector('select').value;
            var invNumber = cells[4].querySelector('input').value.trim().toUpperCase();
            var manufacturer = cells[5].querySelector('select').value;
            var power = cells[6].querySelector('select').value;
            var speed = cells[7].querySelector('select').value;
            var reason = cells[8].querySelector('input').value.trim();
            
            if (!department) { showNotification('Строка ' + (i+1) + ': выберите подразделение', 'error'); return; }
            if (!location) { showNotification('Строка ' + (i+1) + ': выберите место', 'error'); return; }
            if (!manufacturer) { showNotification('Строка ' + (i+1) + ': выберите производителя', 'error'); return; }
            if (!power) { showNotification('Строка ' + (i+1) + ': выберите мощность', 'error'); return; }
            if (!speed) { showNotification('Строка ' + (i+1) + ': выберите обороты', 'error'); return; }
            
            items.push({
                department: department,
                location: location,
                motor: motor,
                invNumber: invNumber,
                manufacturer: manufacturer,
                power: power,
                speed: speed,
                reason: reason
            });
        }
        
        if (items.length === 0) {
            showNotification('Заполните данные хотя бы одного двигателя', 'error');
            return;
        }
        
        showLoading();
        
        var data = {
            responsible: responsible,
            phone: phone,
            items: items
        };
        
        var url = API_URL + '?action=submit&password=' + encodeURIComponent(currentPassword) + '&data=' + encodeURIComponent(JSON.stringify(data));
        
        fetch(url)
            .then(function(response) { return response.json(); })
            .then(function(result) {
                hideLoading();
                if (result.success) {
                    showNotification('✓ Заявка ' + result.applicationNumber + ' сохранена! Записей: ' + result.count, 'success');
                    initForm();
                } else {
                    showNotification(result.error || 'Ошибка сохранения', 'error');
                }
            })
            .catch(function(error) {
                hideLoading();
                showNotification('Ошибка: ' + error.message, 'error');
            });
    }
    
    // === ИСТОРИЯ ===
    function showHistory() {
        document.getElementById('historyModal').style.display = 'flex';
        fillFilter('filterDepartment', settings.departments, 'Все');
        fillFilter('filterLocation', settings.locations, 'Все');
        fillFilter('filterPower', settings.powers, 'Любая');
        loadHistory();
    }
    
    function closeHistory() {
        document.getElementById('historyModal').style.display = 'none';
    }
    
    function fillFilter(id, options, placeholder) {
        var select = document.getElementById(id);
        select.innerHTML = '<option value="">' + placeholder + '</option>';
        for (var i = 0; i < options.length; i++) {
            select.innerHTML += '<option value="' + options[i] + '">' + options[i] + '</option>';
        }
    }
    
    function loadHistory() {
        var department = document.getElementById('filterDepartment').value;
        var location = document.getElementById('filterLocation').value;
        var power = document.getElementById('filterPower').value;
        var invNumber = document.getElementById('filterInvNumber').value.trim();
        
        showLoading();
        
        var url = API_URL + '?action=getHistory&password=' + encodeURIComponent(currentPassword);
        if (department) url += '&department=' + encodeURIComponent(department);
        if (location) url += '&location=' + encodeURIComponent(location);
        if (power) url += '&power=' + encodeURIComponent(power);
        if (invNumber) url += '&invNumber=' + encodeURIComponent(invNumber);
        
        fetch(url)
            .then(function(response) { return response.json(); })
            .then(function(result) {
                hideLoading();
                if (result.success) {
                    renderHistory(result.data);
                } else {
                    showNotification(result.error || 'Ошибка загрузки', 'error');
                }
            })
            .catch(function(error) {
                hideLoading();
                showNotification('Ошибка: ' + error.message, 'error');
            });
    }
    
    function renderHistory(data) {
        var tbody = document.getElementById('historyTable');
        
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="12" style="text-align:center; padding:30px; color:#888;">Заявки не найдены</td></tr>';
            return;
        }
        
        var html = '';
        for (var i = 0; i < data.length; i++) {
            var r = data[i];
            var dateStr = r.date || '';
            // Пытаемся отформатировать дату в Asia/Bangkok (если она парсится), иначе показываем как есть
            var dateFormatted = dateStr ? formatToBangkok(dateStr) : '';
            html += '<tr>' +
                '<td>' + (r.number || '') + '</td>' +
                '<td>' + (dateFormatted || '') + '</td>' +
                '<td>' + (r.department || '') + '</td>' +
                '<td>' + (r.location || '') + '</td>' +
                '<td>' + (r.motor || '') + '</td>' +
                '<td>' + (r.invNumber || '') + '</td>' +
                '<td>' + (r.manufacturer || '') + '</td>' +
                '<td>' + (r.power || '') + '</td>' +
                '<td>' + (r.speed || '') + '</td>' +
                '<td>' + (r.reason || '') + '</td>' +
                '<td>' + (r.responsible || '') + '</td>' +
                '<td>' + (r.phone || '') + '</td>' +
                '</tr>';
        }
        tbody.innerHTML = html;
    }

    // === НОВАЯ ФУНКЦИЯ: ПЕЧАТЬ ИСТОРИИ ===
    // Собирает текущую таблицу истории и открывает новое окно с чистой страницей для печати.
    function printHistory() {
        // Сбор метаданных (фильтры)
        var department = document.getElementById('filterDepartment').value;
        var location = document.getElementById('filterLocation').value;
        var power = document.getElementById('filterPower').value;
        var invNumber = document.getElementById('filterInvNumber').value.trim();

        var filtersHtml = '<div style="margin-bottom:12px; font-size:14px;">';
        if (department) filtersHtml += '<strong>Подразделение:</strong> ' + escapeHtml(department) + ' &nbsp; ';
        if (location) filtersHtml += '<strong>Место:</strong> ' + escapeHtml(location) + ' &nbsp; ';
        if (power) filtersHtml += '<strong>Мощность:</strong> ' + escapeHtml(power) + ' &nbsp; ';
        if (invNumber) filtersHtml += '<strong>Инв. №:</strong> ' + escapeHtml(invNumber) + ' &nbsp; ';
        if (filtersHtml === '<div style="margin-bottom:12px; font-size:14px;">') filtersHtml += '<em>Фильтры: все</em>';
        filtersHtml += '</div>';

        // Получаем таблицу истории (клонируем заголовок и тело)
        var table = document.querySelector('#historyModal .table-container table');
        if (!table) {
            showNotification('Таблица истории не найдена', 'error');
            return;
        }

        // Используем outerHTML, но удаляем потенциальные интерактивные элементы (скрипты/кнопки) — у нас их нет внутри таблицы, поэтому это безопасно.
        var tableHtml = table.outerHTML;

        // Формируем HTML для печати
        var title = 'История заявок';
        var generatedAt = formatToBangkok(new Date());
        var printStyles = '\
            body{font-family:Arial, Helvetica, sans-serif; color:#000; background:#fff; padding:20px;} \
            h1{font-size:18px; margin-bottom:6px;} \
            p.meta{font-size:13px; color:#333; margin-bottom:6px;} \
            table{width:100%; border-collapse:collapse; font-size:12px;} \
            th,td{border:1px solid #444; padding:6px 8px; text-align:left;} \
            thead th{background:#eee;} \
            @media print { button { display:none; } }';

        var html = '<!doctype html><html><head><meta charset="utf-8"><title>' + escapeHtml(title) + '</title><style>' + printStyles + '</style></head><body>';
        html += '<h1>' + escapeHtml(title) + '</h1>';
        html += '<p class="meta">Сформировано: ' + escapeHtml(generatedAt) + ' (GMT+7)</p>';
        html += filtersHtml;
        html += tableHtml;
        html += '</body></html>';

        // Открываем новое окно и печатаем
        var printWindow = window.open('', '_blank');
        if (!printWindow) {
            showNotification('Браузер заблокировал всплывающее окно печати. Разрешите всплывающие окна и попробуйте снова.', 'error');
            return;
        }
        printWindow.document.open();
        printWindow.document.write(html);
        printWindow.document.close();

        // Ждём пока содержимое загрузится, затем вызываем печать
        // Используем небольшой таймаут — обычно достаточно
        setTimeout(function() {
            try {
                printWindow.focus();
                printWindow.print();
                // Не всегда можно безопасно закрыть окно автоматически — оставляем окно открытым, чтобы пользователь мог увидеть результат.
                // Если хотите, можно раскомментировать закрытие:
                // printWindow.close();
            } catch (e) {
                showNotification('Не удалось вызвать диалог печати: ' + e.message, 'error');
            }
        }, 500);
    }

    // Вспомогательная функция: экранирование HTML (чтобы фильтры/текст не ломали страницу)
    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // === НАСТРОЙКИ ===
    function showSettings() {
        document.getElementById('settingsModal').style.display = 'flex';
        renderSettingsList('departmentsList', settings.departments);
        renderSettingsList('locationsList', settings.locations);
        renderSettingsList('manufacturersList', settings.manufacturers);
    }
    
    function closeSettings() {
        document.getElementById('settingsModal').style.display = 'none';
    }
    
    function renderSettingsList(containerId, items) {
        var container = document.getElementById(containerId);
        var html = '';
        for (var i = 0; i < items.length; i++) {
            var item = items[i];
            var escaped = item.replace(/'/g, "\\'");
            html += '<div class="settings-item"><span>' + item + '</span><button onclick="removeItem(\'' + containerId + '\',\'' + escaped + '\')">×</button></div>';
        }
        container.innerHTML = html;
    }
    
    function removeItem(containerId, item) {
        if (containerId === 'departmentsList') {
            settings.departments = settings.departments.filter(function(d) { return d !== item; });
            renderSettingsList(containerId, settings.departments);
        } else if (containerId === 'locationsList') {
            settings.locations = settings.locations.filter(function(l) { return l !== item; });
            renderSettingsList(containerId, settings.locations);
        } else if (containerId === 'manufacturersList') {
            settings.manufacturers = settings.manufacturers.filter(function(m) { return m !== item; });
            renderSettingsList(containerId, settings.manufacturers);
        }
    }
    
    function addDepartment() {
        var input = document.getElementById('newDepartment');
        var value = input.value.trim();
        if (value && settings.departments.indexOf(value) === -1) {
            settings.departments.push(value);
            renderSettingsList('departmentsList', settings.departments);
            input.value = '';
        }
    }
    
    function addLocation() {
        var input = document.getElementById('newLocation');
        var value = input.value.trim();
        if (value && settings.locations.indexOf(value) === -1) {
            settings.locations.push(value);
            renderSettingsList('locationsList', settings.locations);
            input.value = '';
        }
    }
    
    function addManufacturer() {
        var input = document.getElementById('newManufacturer');
        var value = input.value.trim();
        if (value && settings.manufacturers.indexOf(value) === -1) {
            settings.manufacturers.push(value);
            renderSettingsList('manufacturersList', settings.manufacturers);
            input.value = '';
        }
    }
    
    function saveSettings() {
        showLoading();
        
        var saved = 0;
        var total = 3;
        
        function checkDone() {
            saved++;
            if (saved >= total) {
                hideLoading();
                showNotification('Настройки сохранены!', 'success');
                closeSettings();
            }
        }
        
        // Сохраняем подразделения
        var url1 = API_URL + '?action=updateList&password=' + encodeURIComponent(currentPassword) + '&listType=departments&items=' + encodeURIComponent(JSON.stringify(settings.departments));
        fetch(url1).then(checkDone).catch(checkDone);
        
        // Сохраняем места
        var url2 = API_URL + '?action=updateList&password=' + encodeURIComponent(currentPassword) + '&listType=locations&items=' + encodeURIComponent(JSON.stringify(settings.locations));
        fetch(url2).then(checkDone).catch(checkDone);
        
        // Сохраняем производителей
        var url3 = API_URL + '?action=updateList&password=' + encodeURIComponent(currentPassword) + '&listType=manufacturers&items=' + encodeURIComponent(JSON.stringify(settings.manufacturers));
        fetch(url3).then(checkDone).catch(checkDone);
    }
</script>
<!-- === PART 2 END === -->
</body>
</html>
